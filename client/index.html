<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practical AI for Small-Business Owners — EaseIntoAI</title>
    <meta
      name="description"
      content="EaseIntoAI helps small-business owners get one AI system working in their business, with plain-language support and human review. Based in Smyrna, Delaware."
    />
    <link rel="canonical" href="https://easeintoai.co/" />
    <meta name="theme-color" content="#12161F" />

    <!-- Open Graph / Social Sharing (defaults — overridden per-page by JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EaseIntoAI" />
    <meta property="og:url" content="https://easeintoai.co/" />
    <meta
      property="og:title"
      content="Practical AI for Small-Business Owners — EaseIntoAI"
    />
    <meta
      property="og:description"
      content="Practical AI help that starts with your real work, builds the system with you, and keeps you in control."
    />
    <meta property="og:image" content="https://easeintoai.co/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="EaseIntoAI — practical AI for real work"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Practical AI for Small-Business Owners — EaseIntoAI"
    />
    <meta
      name="twitter:description"
      content="Practical AI help that starts with your real work, builds the system with you, and keeps you in control."
    />
    <meta name="twitter:image" content="https://easeintoai.co/og-image.png" />

    <!-- Structured Data: Organization + WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://easeintoai.co/#organization",
            "name": "EaseIntoAI",
            "url": "https://easeintoai.co/",
            "logo": "https://easeintoai.co/logo.png",
            "description": "Practical AI education and hands-on implementation for small-business owners.",
            "founder": { "@type": "Person", "name": "Emmanuel Kerkulah" },
            "email": "hello@easeintoai.co",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Smyrna",
              "addressRegion": "DE",
              "addressCountry": "US"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://easeintoai.co/#website",
            "url": "https://easeintoai.co/",
            "name": "EaseIntoAI",
            "publisher": { "@id": "https://easeintoai.co/#organization" }
          }
        ]
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
